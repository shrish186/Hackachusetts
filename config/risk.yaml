# Whale encounter risk model parameters (Lane A, Task 1.4, design.md section 5).
#
# These live here (not in code) so they are explainable and tweakable during
# the demo. All distances in kilometers, times in days, speeds in knots.
#
# risk(c, t, v) = p_whale(c, t) * lethality(v)
#   p_whale = clip(alpha * presence + (1 - alpha) * recency, 0, 1)
#   lethality(v) = 1 / (1 + exp(-(v - v50) / k))

presence:
  # Weight on the seasonal presence prior vs. recent-sighting recency.
  # alpha in [0, 1]: higher = lean on the seasonal prior.
  alpha: 0.6
  # Kernel bandwidth (km) for smoothing historical sighting density into a
  # presence field. Larger = smoother / more spread out.
  presence_kernel_km: 15.0
  # Fixed density scale for the saturating presence map 1 - exp(-density/scale).
  # Using a constant (not a data-dependent max) keeps presence per-cell and
  # monotonic non-decreasing as sightings are added. Tune for demo contrast.
  presence_scale: 4.0

recency:
  # Age decay time constant tau (days): a sighting's contribution decays as
  # exp(-age_days / tau).
  tau_days: 7.0
  # Distance decay length rho (km): contribution decays as exp(-dist_km / rho).
  rho_km: 10.0
  # Only sightings within this radius (km) of a cell affect its recency term.
  radius_km: 30.0

lethality:
  # Vessel-speed vs. lethal-injury logistic curve for large whales.
  # VERIFIED against Vanderlaan, A. & Taggart, C. (2007), "Vessel Collisions
  # with Whales: The Probability of Lethal Injury Based on Vessel Speed",
  # Marine Mammal Science 23(1):144-156.
  # Source (open PDF): http://www.phys.ocean.dal.ca/~taggart/Publications/Vanderlaan_Taggart_MarMamSci-23_2007.pdf
  # Published findings: P(lethal) = 0.50 at 11.8 kn; 0.21 at 8.6 kn; 0.79 at
  # 15 kn; asymptotes to ~1 above ~21 kn.
  v50_kn: 11.8   # VERIFIED: speed (kn) at 50% lethality (Vanderlaan & Taggart 2007)
  # k derived from the published anchors: solving the logistic for both
  # (8.6 kn, 0.21) and (15 kn, 0.79) gives k = 2.415 (fit also matches 0.81 at
  # 15.3 kn and ~0.98 at 21 kn). Replaces the old 2.0 placeholder.
  k: 2.415       # VERIFIED: logistic steepness derived from Vanderlaan & Taggart 2007 anchor points

bounds:
  # Risk is always clipped to this closed interval.
  risk_min: 0.0
  risk_max: 1.0
