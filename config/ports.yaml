# Massachusetts fishing ports and fishing grounds (Lane A, task 4).
#
# Port coordinates are the approximate harbor mouth / anchorage (decimal
# degrees, WGS84) chosen to sit in navigable water near the grid, not the town
# centroid. Fishing-ground coordinates are representative centers of well-known
# grounds. Verified against public gazetteer / NOAA chart references.
#
# synthetic: false for the point coordinates (these are real, published
# locations), but routes/effort built on them remain model estimates.

ports:
  # Coordinates are the nearest navigable WATER cell to each real harbor on the
  # study grid. The real harbor mouths sit at the coast, and the bundled land
  # mask is a coarse approximation, so a harbor-mouth point can land in a "land"
  # cell. Using the adjacent water cell keeps every trip origin routable while
  # staying within a few km of the real harbor. See docs/DATA.md.
  gloucester:
    name: "Gloucester"
    lon: -70.625
    lat: 42.575
    note: "Off Gloucester Harbor, Cape Ann (nearest water cell to -70.662,42.610)"
  boston:
    name: "Boston"
    lon: -70.875
    lat: 42.425
    note: "Boston Harbor outer approaches (nearest water cell to -70.950,42.350)"
  plymouth:
    name: "Plymouth"
    lon: -70.625
    lat: 42.025
    note: "Off Plymouth in Cape Cod Bay (nearest water cell to -70.650,41.958)"
  provincetown:
    name: "Provincetown"
    lon: -70.180
    lat: 42.050
    note: "Provincetown Harbor, tip of Cape Cod"
  new_bedford:
    name: "New Bedford"
    lon: -70.912
    lat: 41.630
    note: "New Bedford Harbor (outer, near hurricane barrier)"

fishing_grounds:
  stellwagen_bank:
    name: "Stellwagen Bank"
    lon: -70.250
    lat: 42.350
    note: "Stellwagen Bank National Marine Sanctuary, central bank"
  jeffreys_ledge:
    name: "Jeffreys Ledge"
    lon: -70.250
    lat: 42.900
    note: "Jeffreys Ledge, northern Gulf of Maine (near bbox north edge)"
  cape_cod_bay:
    name: "Cape Cod Bay"
    lon: -70.350
    lat: 41.900
    note: "Central Cape Cod Bay"
