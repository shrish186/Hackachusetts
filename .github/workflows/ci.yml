name: CI

# Fast CI for Fathom: backend tests, frontend build+lint, dependency audits,
# and a secret scan. Runs on every push and pull request. Jobs run in parallel
# and are kept lean (shallow checkout, dependency caching, pinned actions).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref to save minutes.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install "ruff>=0.6"
          # Ruff defaults (E4,E7,E9,F), isolated from any user config. The per-file
          # ignores cover existing findings in other lanes' files; owners: remove
          # an entry once its file is clean.
          ruff check --isolated --select E4,E7,E9,F --target-version py311 \
            --config 'lint.per-file-ignores = {"app/engine/simulator.py" = ["F401", "E731"], "app/ingest/ndbc.py" = ["F401"], "tests/test_conditions.py" = ["F401"], "tests/test_zones.py" = ["F401"]}' \
            . ../mcp
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (type-check)
        run: npm run lint
      - name: Build
        run: npm run build

  pip-audit:
    name: Audit Python deps (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt

  npm-audit:
    name: Audit Node deps (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits on PRs/pushes.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
